version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: whatif-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"  # localhost only
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    networks:
      - whatif-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  falkordb:
    image: falkordb/falkordb:latest
    container_name: whatif-falkordb
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"  # localhost only
      - "127.0.0.1:3000:3000"  # FalkorDB Browser (graph UI)
    environment:
      FALKOR_PASSWORD: ${FALKOR_PASSWORD:?set FALKOR_PASSWORD in .env}
      REDIS_ARGS: --requirepass ${FALKOR_PASSWORD:?set FALKOR_PASSWORD in .env}
    volumes:
      - falkor_data:/data
    networks:
      - whatif-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$FALKOR_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
    driver: local
  falkor_data:
    driver: local

networks:
  whatif-network:
    driver: bridge

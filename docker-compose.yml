version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: whatif-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - whatif-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  falkordb:
    image: falkordb/falkordb:latest
    container_name: whatif-falkordb
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - falkor_data:/data
    networks:
      - whatif-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
    driver: local
  falkor_data:
    driver: local

networks:
  whatif-network:
    driver: bridge
